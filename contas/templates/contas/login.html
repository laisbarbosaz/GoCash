{% extends "base.html" %}
{% block content %}

<style>
    form {
        max-width: 400px;
        border: 2px solid #12460b;
        border-radius: 12px;
        padding: 20px;
        margin: 40px auto;
        background-color: #f9fdf8;
        text-align: center;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: #0b2608;
    }

    input.form-control {
        width: 80%;
        margin: 0 auto 15px auto;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    .btn-success {
        background-color: #12460b;
        color: #fff;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        border: none;
        transition: background-color 0.3s ease;
    }

    .btn-success:hover {
        background-color: #14540c;
    }

    .alert {
        width: 80%;
        margin: 10px auto;
        text-align: center;
    }

    p, a {
        color: #0b2608;
    }
</style>

<form method="post">
    {% csrf_token %}

    <div class="form-group mb-3">
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" value="{{ form.username.value|default_if_none:'' }}"
               class="form-control{% if form.username.errors %} is-invalid{% endif %}" required>
        {% include "partials/erros_campo.html" with campo=form.username %}
    </div>

    <div class="form-group mb-3">
        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password"
               class="form-control{% if form.password.errors %} is-invalid{% endif %}" required>
        {% include "partials/erros_campo.html" with campo=form.password %}
    </div>

    <button type="submit" class="btn btn-success">Entrar</button>
    <p class="mt-3">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</form>

{% endblock %}
